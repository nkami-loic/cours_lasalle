
name: Pipeline ELT Quotidien

on:
  workflow_dispatch:        # lancement manuel (utile pour tester)


jobs:
  run-elt:
    runs-on: ubuntu-latest

    # Permissions requises pour Workload Identity Federation (OIDC) :
    # GitHub fournit un jeton temporaire à Google Cloud, donc aucune clé
    # JSON à stocker dans le dépôt (plus sûr).
    permissions:
      contents: 'read'
      id-token: 'write'

    # Variables pour que dlt (Python) trouve le projet BigQuery. Les
    # credentials, eux, viennent de l'étape d'authentification ci-dessous.
    env:
      GOOGLE_CLOUD_PROJECT: lasalle-big-data
      DESTINATION__BIGQUERY__CREDENTIALS__PROJECT_ID: lasalle-big-data

    steps:
      - name: Récupérer le code (Checkout)
        uses: actions/checkout@v4

      - name: Authentification Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/833312929773/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-elt@lasalle-big-data.iam.gserviceaccount.com'

      - name: Installation de Python et dlt
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
    
      - run: |
          pip install "dlt[bigquery,gs]"


      - name: 1. Ingestion API vers Bronze
        run: python ingestion/load_products.py

      - name: 2. Transformation Bronze vers Silver
        run: bq query --use_legacy_sql=false --project_id=lasalle-big-data < transformations/silver.sql

      - name: 3. Agrégation Silver vers Gold
        run: bq query --use_legacy_sql=false --project_id=lasalle-big-data < transformations/gold.sql
