[project]
name = "cours-lasalle-big-data"
version = "0.1.0"
description = "Formation Intensive Big Data & Data Engineering sur GCP (21h) - La Salle"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dlt[bigquery,duckdb]>=1.5.0",
    "dbt-bigquery>=1.8.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-storage>=2.18.0",
    "google-cloud-pubsub>=2.23.0",
    "apache-beam[gcp]>=2.58.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "requests>=2.32.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.2.0",
    "pytest>=8.2.0",
    "curl-cffi>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[dependency-groups]
dev = [
    "ruff>=0.5.0",
]
